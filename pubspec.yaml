name: skysecret
description: "SkySecret: a private Windows secret manager that lives in the system tray."
publish_to: 'none'
version: 0.3.1+10

environment:
  sdk: ^3.13.0

dependencies:
  characters: ^1.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hotkey_manager: ^0.2.3
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  win32: ^6.4.0
  ffi: ^2.2.0
  slang: ^4.19.1
  slang_flutter: ^4.19.0
  uni_platform: ^0.1.3
  cryptography: ^2.9.0
  file_selector: ^1.1.0
  desktop_multi_window: ^0.3.1

dev_dependencies:
  analyzer: 14.3.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file_selector_platform_interface: ^2.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
